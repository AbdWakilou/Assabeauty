<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- ── Titre & SEO ──────────────────────────────────── -->
    <title>ASBeauty — Gestion de Rendez-vous</title>
    <meta name="description" content="ASBeauty gère votre agenda, confirme les rendez-vous et fidélise vos clientes. La solution SaaS pour salons de coiffure, beauté, spa, tatouage et henné." />
    <meta name="keywords" content="salon beauté, gestion rendez-vous, coiffure, spa, Afrique de l'Ouest" />
    <meta name="author" content="ASBeauty" />

    <!-- ── PWA — Manifest & Theme ───────────────────────── -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#29B6F6" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="ASBeauty" />

    <!-- ── PWA — Apple / iOS ────────────────────────────── -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ASBeauty" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192x192.png" />

    <!-- ── PWA — Windows / MS ───────────────────────────── -->
    <meta name="msapplication-TileColor" content="#29B6F6" />
    <meta name="msapplication-TileImage" content="/icons/icon-144x144.png" />
    <meta name="msapplication-config" content="none" />

    <!-- ── Favicon ──────────────────────────────────────── -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-96x96.png" />
    <link rel="shortcut icon" href="/favicon.ico" />

    <!-- ── Open Graph ───────────────────────────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ASBeauty — Gestion de Rendez-vous" />
    <meta property="og:description" content="Gérez votre salon, vos clients et vos rendez-vous facilement." />
    <meta property="og:image" content="/icons/icon-512x512.png" />

    <!-- ── Fonts ────────────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
