<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASBeauty — Hors ligne</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      color: #fff;
      font-family: 'Poppins', system-ui, sans-serif;
      text-align: center;
      padding: 24px;
      gap: 20px;
    }
    img { width: 120px; opacity: .85; }
    h1 { font-size: 1.4rem; font-weight: 600; color: #29B6F6; }
    p { color: #888; font-size: .9rem; max-width: 280px; line-height: 1.6; }
    button {
      margin-top: 8px;
      padding: 12px 28px;
      background: #29B6F6;
      color: #000;
      border: none;
      border-radius: 12px;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:active { opacity: .8; }
  </style>
</head>
<body>
  <img src="/icons/icon-192x192.png" alt="ASBeauty" />
  <h1>Vous êtes hors ligne</h1>
  <p>Vérifiez votre connexion Internet et réessayez.</p>
  <button onclick="location.reload()">↻ Réessayer</button>
</body>
</html>
